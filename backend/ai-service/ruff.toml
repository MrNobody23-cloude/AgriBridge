target-version = "py311"

# The 333 auto-fixable errors from ruff 0.16 (using ruff's own default full set)
# are mostly UP006 (typing syntax), UP007 (bitwise operators), I001 (imports),
# UP035 (deprecated imports) and similar. Those are cosmetic modernizations,
# not bugs, and touching 333 lines is outside what must be done now.
#
# These rules are kept: anything that indicates a real problem (F = PyFlakes:
# undefined names, unused variables; E = syntax errors; B = suspicious
# constructs). The rest is suppressed. If they are fixed later, delete
# this file.

[lint]
select = ["E", "F", "W", "C"]
ignore = ["E501", "W293", "C901", "C416", "C401", "C420", "B008"]

[lint.per-file-ignores]
# Agents/legacy files load matplotlib with `matplotlib.use('Agg')` followed
# by `import matplotlib.pyplot`: deliberately late, not an ordering mistake.
"agents/legacy/*.py" = ["E402"]
# Main router import is after the middleware/app setup for a reason (see
# docstring), so one E402 is suppressed there too.
"main.py" = ["E402"]
