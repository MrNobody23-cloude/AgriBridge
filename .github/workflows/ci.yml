name: AgriBridge AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────────────────
  lint-frontend:
    name: Lint & Type Check (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit

  lint-python:
    name: Lint (Python AI Service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linter
        run: pip install ruff
      - name: Run ruff
        run: ruff check ai-service/

  # ── Tests ──────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Setup test database
        run: |
          cp .env.example .env
          echo 'DATABASE_URL="file:./test.db"' >> .env
          echo 'AUTH_SECRET="test-secret-for-ci-only-not-production"' >> .env
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
        env:
          DATABASE_URL: "file:./test.db"
          AUTH_SECRET: "test-secret-for-ci-only-not-production"

  test-python:
    name: Python AI Service Tests
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # requirements-dev.txt pulls in requirements.txt and the test-only
      # packages. CI previously hardcoded `pip install pytest pytest-asyncio
      # httpx` on a separate line, which meant the list of things the suite
      # needs lived in two places and only in one of them was it written down.
      - name: Install dependencies
        run: pip install -r ai-service/requirements-dev.txt
      - name: Run tests
        run: python -m pytest ai-service/tests -v --tb=short
        env:
          GEMINI_API_KEY: ""  # Tests must not require real API keys

  test-blockchain:
    name: Hardhat Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Compile contracts
        run: npx hardhat compile
      - name: Run contract tests
        run: npx hardhat test

  # ── Build ──────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: [test-frontend, test-blockchain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "build-placeholder-not-real"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          AI_SERVICE_URL: "http://localhost:8000"

  # ── Python AI service: run natively, no container ──────────────────────────
  # The application is required to run natively on Windows/Linux/macOS, so CI
  # exercises the same path a developer does. This job also fails loudly if a
  # trained artifact is missing, which the Docker build never checked.
  build-python:
    name: Verify Python AI Service
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
      - name: Import the agent modules
        run: |
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, str(pathlib.Path('ai-service').resolve()))
          import main, routers, rag.pipeline, ml.inference, agents.loader
          print('ai-service modules import cleanly')
          PY
