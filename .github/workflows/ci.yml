name: AgriBridge AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────────────────
  lint-frontend:
    name: Lint & Type Check (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  lint-python:
    name: Lint (Python AI Service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linter
        run: pip install ruff
      - name: Run ruff
        run: ruff check --config backend/ai-service/ruff.toml backend/ai-service/

  # ── Tests ────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint-python
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        run: npm ci

      - name: Configure environment
        run: |
          cp ../.env.example .env
          {
            echo 'MONGODB_URI="mongodb://127.0.0.1:27017/agribridge_ai_test"'
            echo 'AUTH_SECRET="test-secret-for-ci-only-not-production"'
          } >> .env

      - run: npm test
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/agribridge_ai_test"
          AUTH_SECRET: "test-secret-for-ci-only-not-production"

  test-python:
    name: Python AI Service Tests
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r backend/ai-service/requirements-dev.txt
      - name: Run tests
        run: python -m pytest -c backend/ai-service/pytest.ini backend/ai-service/tests -v --tb=short
        env:
          GEMINI_API_KEY: ""

  test-blockchain:
    name: Hardhat Smart Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Compile contracts
        run: npx hardhat compile
      - name: Run contract tests
        run: npx hardhat test

  # ── Build ────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-backend, test-blockchain]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: "build-placeholder-not-real"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          AI_SERVICE_URL: "http://localhost:8000"

  build-python:
    name: Verify Python AI Service
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/ai-service/requirements.txt
      - name: Import the agent modules
        run: |
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, str(pathlib.Path('backend/ai-service').resolve()))
          import main, routers, rag.pipeline, ml.inference, agents.loader
          print('ai-service modules import cleanly')
          PY
